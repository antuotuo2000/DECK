<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deckers Brands｜每日新闻时间线</title><style>
:root{color-scheme:dark;--bg:#101110;--ink:#f1eee7;--muted:#a6ad9e;--red:#ed403b;--line:#343b2d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.85 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}a{color:#c8d4b6;text-decoration:none}a:hover{color:var(--red)}header{padding:22px 5vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}header b{letter-spacing:2px;font-size:13px}em{font-style:normal;color:var(--red)}main{max-width:1000px;margin:auto;padding:56px 40px}small,.note{color:var(--muted);font-size:12px}.eyebrow{color:var(--red);font-size:11px;letter-spacing:3px}h1{font-size:clamp(35px,5vw,56px);line-height:1.3;font-weight:550;letter-spacing:-1px}p{color:#ced1c7}.lead{max-width:660px}.tools{display:flex;gap:10px;flex-wrap:wrap;padding:24px 0;border-top:1px solid var(--line);margin-top:30px}button,input,select{font:inherit;background:#171a15;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:10px 14px}button{cursor:pointer}button.active{background:var(--ink);color:var(--bg)}input{flex:1;min-width:180px}:focus-visible{outline:2px solid var(--red);outline-offset:4px}.day{display:grid;grid-template-columns:130px 1fr;gap:25px}.day time{font-size:14px;color:#b8c798;padding-top:22px;font-variant-numeric:tabular-nums}.events{border-left:1px solid #48513e;padding:0 0 30px 30px;position:relative}.events:before{content:'';position:absolute;left:-5px;top:29px;width:9px;height:9px;background:var(--red);border-radius:50%}.event{border:1px solid #3b4531;background:#171a15;border-radius:8px;padding:24px;margin-bottom:14px}.event h2{font-size:21px;line-height:1.5;font-weight:500;margin:12px 0}.event p{font-size:15px;margin:12px 0 20px}.tag{font-size:11px;color:#b8c798;border:1px solid #414a38;padding:3px 9px}.source{border-top:1px solid var(--line);padding-top:14px;font-size:12px}.status{font-size:12px;color:var(--muted);margin-bottom:24px}footer{border-top:1px solid var(--line);padding:25px 5vw;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}@media(max-width:650px){main{padding:36px 6vw}.day{grid-template-columns:1fr;gap:8px}.day time{padding-top:0}.events{margin-left:4px;padding-left:20px}.events:before{top:24px}.event{padding:20px}header b{display:none}footer{gap:20px;flex-wrap:wrap}}
</style><header><a href="./">← Deckers 研究</a><b>WANGAN <em>RESEARCH</em></b><a href="https://antuotuo2000.github.io/RBLX/">研究主页 ↗</a></header><main><div class="eyebrow">DECK / NEWS TIMELINE</div><h1>Deckers Brands<br>每天的新进展，<em>沿时间看。</em></h1><p class="lead">追踪 HOKA、UGG 与公司经营动态。同一天的新闻集中展示，让事件顺序和原始来源都清晰可查。</p><p class="note">整理日期：2026-11-13（北京时间） · 新闻日期沿用来源发布日期。当前为精选新闻快照，非实时或自动每日更新；未列出的日期不代表没有新闻。</p><div class="tools"><button class="active" data-kind="全部">全部</button><button data-kind="财报">财报</button><button data-kind="品牌">品牌</button><button data-kind="治理">治理</button><input id="q" type="search" aria-label="搜索新闻" placeholder="搜索新闻或品牌"><select id="order" aria-label="时间顺序"><option value="desc">最新在前</option><option value="asc">最早在前</option></select></div><div class="status" id="status" role="status"></div><div id="timeline"></div><p class="note">继续查阅：<a href="https://ir.deckers.com/news-events/press-releases">公司公告 ↗</a> · <a href="https://ir.deckers.com/sec-filings/all-sec-filings">SEC 文件 ↗</a></p></main><footer><span>DECK · 每日新闻时间线</span><a href="./">返回 Deckers 研究 ↗</a></footer><script>const data=[["2026-11-02","品牌","UGG 推出节日营销活动","UGG 发布“Gifts the Feeling”节日营销活动，邀请多位艺人参与礼物交换。","https://finance.yahoo.com/media-advertising/articles/ugg-gifts-feeling-holiday-jt-180100797.html","Business Wire / Yahoo Finance"],["2026-10-22","财报","发布 FY2027 第二季度业绩","公司披露截至2026年9月30日的季度业绩，并更新全年财务展望。","https://ir.deckers.com/news-events/press-releases/detail/666/deckers-brands-reports-second-quarter-fiscal-year-2027-financial-results","Deckers 投资者关系"],["2026-10-22","治理","任命 Rati Sahi Levesque 为董事","董事任命将于2026年12月1日生效；同日 Lauri Shanahan 将退休离任。","https://ir.deckers.com/news-events/press-releases/detail/667/deckers-brands-appoints-rati-sahi-levesque-to-board-of-directors","Deckers 投资者关系"],["2026-10-12","财报","公布季度业绩电话会安排","公司公告将于10月22日举行 FY2027 第二季度业绩电话会。","https://ir.deckers.com/news-events/press-releases/detail/665/deckers-brands-announces-conference-call-to-review-second-quarter-fiscal-2027-earnings-results","Deckers 投资者关系"]];let kind='全部';const q=document.getElementById('q'),order=document.getElementById('order'),timeline=document.getElementById('timeline');function render(){const rows=data.filter(r=>(kind==='全部'||r[1]===kind)&&r.join(' ').toLowerCase().includes(q.value.toLowerCase())).sort((a,b)=>order.value==='desc'?b[0].localeCompare(a[0]):a[0].localeCompare(b[0]));timeline.replaceChildren();const dates=[...new Set(rows.map(r=>r[0]))];document.getElementById('status').textContent=rows.length?'共 '+rows.length+' 条新闻 · '+dates.length+' 个日期':'没有匹配的新闻';dates.forEach(date=>{const day=document.createElement('section');day.className='day';const time=document.createElement('time');time.dateTime=date;time.textContent=date;day.append(time);const events=document.createElement('div');events.className='events';rows.filter(r=>r[0]===date).forEach(r=>{const article=document.createElement('article');article.className='event';const tag=document.createElement('span');tag.className='tag';tag.textContent=r[1];const title=document.createElement('h2');title.textContent=r[2];const p=document.createElement('p');p.textContent=r[3];const source=document.createElement('div');source.className='source';const a=document.createElement('a');a.href=r[4];a.textContent=r[5]+' · 阅读原文 ↗';source.append(a);article.append(tag,title,p,source);events.append(article)});day.append(events);timeline.append(day)})}document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(n=>n.classList.toggle('active',n===b));render()});q.oninput=render;order.onchange=render;render();</script></html>
